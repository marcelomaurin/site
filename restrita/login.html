<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso ao Espaço Restrito | Maurinsoft Serviços</title>
  <meta name="description" content="Acesso restrito para prestação de serviços, ordens de serviço, suporte a equipamentos e downloads técnicos da Maurinsoft.">
  <link rel="stylesheet" href="../assets/css/main.css">
  <style>
    .login-wrapper {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      position: relative;
    }

    .login-card {
      width: 100%;
      max-width: 460px;
      background: rgba(13, 20, 36, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      box-shadow: var(--shadow-lg), 0 0 50px rgba(0, 210, 255, 0.15);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
    }

    .login-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid rgba(0, 210, 255, 0.25);
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 1.5rem;
    }

    .login-logo {
      height: 50px;
      width: auto;
      margin: 0 auto 1.5rem;
      display: block;
    }

    .demo-box {
      margin-top: 1.75rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--border-glass);
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <!-- Minimal Header -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="../index.html" class="brand-logo" aria-label="Maurinsoft Início">
        <img src="../assets/img/logo-maurinsoft.svg" alt="Maurinsoft" class="site-logo-img">
      </a>
      <div class="nav-cta">
        <a href="../index.html" class="btn btn-secondary btn-sm">
          &larr; Voltar ao Portal Público
        </a>
      </div>
    </div>
  </header>

  <main class="login-wrapper">
    <div class="login-card">
      <span class="login-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        Ambiente Seguro • Prestação de Serviços
      </span>

      <h1 style="font-family: var(--font-heading); font-size: 1.8rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem;">
        Espaço Restrito
      </h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">
        Acompanhamento de ordens de serviço, manutenção de equipamentos, laudos e suporte técnico.
      </p>

      <form id="form-login-restrito" style="text-align: left;">
        <div class="form-group">
          <label class="form-label" for="login-user">Operador / E-mail Corporativo</label>
          <input type="text" id="login-user" class="form-control" placeholder="ex: cliente@empresa.com ou admin" required>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" for="login-pass" style="margin: 0;">Senha de Segurança</label>
            <a href="#" onclick="alert('Entre em contato com o suporte Maurinsoft pelo WhatsApp (16) 98143-4112 para redefinição de chave.'); return false;" style="font-size: 0.78rem; color: var(--primary);">Esqueci a senha</a>
          </div>
          <input type="password" id="login-pass" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-perfil">Perfil do Usuário</label>
          <select id="login-perfil" class="form-control" style="cursor: pointer;">
            <option value="cliente">Cliente Corporativo / Solicitante</option>
            <option value="prestador">Prestador de Serviço / Engenharia Maurinsoft</option>
            <option value="laboratorio">Clínica / Sistema Biomédico</option>
          </select>
        </div>

        <div id="login-error-msg" style="display: none; padding: 10px; margin-bottom: 1rem; border-radius: 6px; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; font-size: 0.85rem;"></div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
          Entrar no Espaço Restrito
        </button>

        <button type="button" id="btn-demo-login" class="btn btn-secondary btn-sm" style="width: 100%; margin-top: 0.75rem;">
          Acessar com Credencial de Demonstração (1 Clique)
        </button>
      </form>

      <div class="demo-box">
        <strong>Acesso Técnico:</strong> Conexão criptografada ponta a ponta com auditoria e controle de chamados ativo.
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('form-login-restrito');
      const btnDemo = document.getElementById('btn-demo-login');
      const errorMsg = document.getElementById('login-error-msg');

      function doLogin(user, perfil) {
        sessionStorage.setItem('maurinsoft_auth', 'true');
        sessionStorage.setItem('maurinsoft_user', user);
        sessionStorage.setItem('maurinsoft_perfil', perfil);
        window.location.href = 'index.html';
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const user = document.getElementById('login-user').value.trim();
        const pass = document.getElementById('login-pass').value.trim();
        const perfil = document.getElementById('login-perfil').value;

        if (user && pass) {
          doLogin(user, perfil);
        } else {
          errorMsg.textContent = 'Por favor, preencha o usuário e a senha de segurança.';
          errorMsg.style.display = 'block';
        }
      });

      btnDemo.addEventListener('click', () => {
        document.getElementById('login-user').value = 'cliente.demonstracao';
        document.getElementById('login-pass').value = '123456';
        doLogin('Cliente Corporativo (Demo)', 'cliente');
      });
    });
  </script>
</body>
</html>
